name: Refine action buttons

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refine-action-buttons.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch action button sizing and colors
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='/* ---------- ACTION BUTTON FINAL OVERRIDE ---------- */'
          css=r'''

          /* ---------- ACTION BUTTON FINAL OVERRIDE ---------- */
          #btnCheck,#btnRaise{
            flex:1.16 1 0!important;
            min-height:60px!important;
            font-size:15px!important;
            font-weight:900!important;
            letter-spacing:.075em!important;
            opacity:1!important;
            filter:none!important;
            -webkit-filter:none!important;
          }
          #btnCheck{
            color:#1a1206!important;
            background:#d8b75c!important;
            background-image:linear-gradient(180deg,#fff0b6 0%,#e6c86f 34%,#c79b38 72%,#9a7021 100%)!important;
            border:2px solid #ffe6a0!important;
            box-shadow:0 4px 14px rgba(230,200,111,.55),inset 0 1px 0 rgba(255,255,255,.45)!important;
            text-shadow:0 1px 0 rgba(255,255,255,.35)!important;
          }
          #btnRaise{
            color:#fff7f7!important;
            background:#b82d39!important;
            background-image:linear-gradient(180deg,#f05a66 0%,#cf3845 35%,#a31f2b 72%,#6f1018 100%)!important;
            border:2px solid #ff6c77!important;
            box-shadow:0 4px 14px rgba(216,67,78,.58),inset 0 1px 0 rgba(255,255,255,.22)!important;
            text-shadow:0 1px 2px rgba(0,0,0,.55)!important;
          }
          #btnCheck[disabled],#btnRaise[disabled]{
            opacity:.76!important;
            filter:saturate(.9) brightness(.86)!important;
            -webkit-filter:saturate(.9) brightness(.86)!important;
          }
          #actRow.live #btnCheck:not([disabled]),#actRow.live #btnRaise:not([disabled]){
            opacity:1!important;
            filter:none!important;
            -webkit-filter:none!important;
          }
          @media(max-width:520px){
            #btnCheck,#btnRaise{min-height:58px!important;font-size:14px!important}
          }
          @media(max-width:520px) and (max-height:740px){
            #btnCheck,#btnRaise{min-height:54px!important;font-size:13px!important}
          }
          '''
          if marker not in s:
              s=s.replace('\n</style>',css+'\n</style>',1)
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Increase check and raise buttons and restore colors"
          git push
