name: Fix start buttons JavaScript

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-start-buttons-js.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair broken regular expression
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          broken = "const safe=prefix.replace(/([%_\\])/g,'\\$1');"
          fixed = "const safe=prefix.replace(/([%_\\\\])/g,'\\\\$1');"
          if broken not in s:
              raise SystemExit('Broken expression not found')
          s = s.replace(broken, fixed, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Validate JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s = Path('index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', s, re.S)
          for i, script in enumerate(scripts):
              Path(f'/tmp/script-{i}.js').write_text(script, encoding='utf-8')
          PY
          for file in /tmp/script-*.js; do node --check "$file"; done
      - name: Commit repaired game
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Fix game start buttons JavaScript"
          git push
