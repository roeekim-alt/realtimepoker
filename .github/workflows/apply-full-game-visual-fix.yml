name: Apply full game visual fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-full-game-visual-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-existing-full-game:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch existing full index
        shell: bash
        run: python -c "import base64,pathlib; p=pathlib.Path('index.html'); s=p.read_text(encoding='utf-8'); css=base64.b64decode('').decode(); marker='/* FULL GAME VISUAL FIX V6 */'; s=s if marker in s else s.replace('</style>',css+'\n</style>',1); p.write_text(s,encoding='utf-8')"
      - name: Commit visual fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Apply full game visual fix"
          git push
