name: Fix mobile layout and colors

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-mobile-layout-colors.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch responsive layout and colors
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = '/* ---------- MOBILE VIEWPORT + COLOR STABILITY FIX ---------- */'
          patch = r'''

          /* ---------- MOBILE VIEWPORT + COLOR STABILITY FIX ---------- */
          html,body{height:100dvh;min-height:100dvh;color-scheme:only dark;background:#0a0806!important}
          body,.screen,#game{min-height:100dvh;height:100dvh}
          body{forced-color-adjust:none;-webkit-text-size-adjust:100%;text-size-adjust:100%}
          #game{isolation:isolate}
          #game,.felt,.topbar,#actions,.abtn,.tb-pill,.iconbtn{forced-color-adjust:none}
          :root{color-scheme:dark}
          .abtn.checkcall{color:#171109!important;background:linear-gradient(180deg,#f0d997 0%,#c9a24b 58%,#96732e 100%)!important;border-color:#f0d997!important;box-shadow:0 3px 12px rgba(201,162,75,.42)!important}
          .abtn.raise{color:#fff!important;background:linear-gradient(180deg,#dc4a55 0%,#a2242c 58%,#74151c 100%)!important;border-color:#ee6670!important;box-shadow:0 3px 12px rgba(162,36,44,.46)!important}
          .abtn.allin-btn{color:#f06a73!important;border-color:#b82b34!important;background:rgba(38,10,14,.88)!important}
          .abtn.fold{color:#e1d4c7!important;background:rgba(24,19,16,.9)!important}
          .abtn[disabled]{opacity:.58!important;filter:saturate(.78) brightness(.9)}
          #actRow.live .abtn:not([disabled]){opacity:1!important;filter:none!important}

          @media (max-width:520px){
            .topbar{padding:calc(5px + var(--safe-t)) 8px 4px;flex:0 0 auto}
            .tb-pill{padding:6px 10px;gap:7px;font-size:11px}
            .iconbtn{width:38px;height:38px;border-radius:9px}
            #tableWrap{flex:1 1 auto;min-height:0;padding:0 3px;overflow:hidden}
            #table{height:min(100%,calc(100dvh - 242px));max-height:calc(100dvh - 242px);width:min(100%,calc((100dvh - 242px)*.72));max-width:100%;aspect-ratio:.72;margin:auto}
            .felt{top:6%;bottom:4%;left:3%;right:3%;border-width:7px}
            #railLight{top:6%;bottom:4%;left:3%;right:3%}
            .seat{width:76px}
            .seat .av{width:46px;height:46px}
            .seat .plate{padding:2px 5px}
            .seat .nm{font-size:9px}
            .seat .stk{font-size:12px}
            #heroArea{padding:2px 10px 3px;flex:0 0 auto}
            #heroCards .card{width:54px;height:76px}
            #heroInfo{min-width:92px;padding-bottom:2px}
            #heroStack{font-size:19px}
            #actions{padding:5px 8px calc(7px + var(--safe-b));flex:0 0 auto}
            #actRow{gap:6px}
            .abtn{min-height:50px;font-size:12px;border-radius:10px;letter-spacing:.055em}
          }

          @media (max-width:520px) and (max-height:740px){
            #table{height:min(100%,calc(100dvh - 218px));max-height:calc(100dvh - 218px);width:min(100%,calc((100dvh - 218px)*.70));aspect-ratio:.70}
            .seat{width:70px}
            .seat .av{width:42px;height:42px}
            .seat .mini-cards{height:25px}
            .mini-card{width:18px;height:25px}
            #heroCards .card{width:49px;height:69px}
            #heroStack{font-size:18px}
            .abtn{min-height:46px;font-size:11px}
            #actions{padding-top:3px}
          }
          '''
          if marker not in s:
              s = s.replace('\n</style>', patch + '\n</style>', 1)
              p.write_text(s, encoding='utf-8')
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Fix mobile layout and preserve game colors"
          git push
