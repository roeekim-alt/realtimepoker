name: Repair game runtime v2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-game-runtime-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair multiplayer storage expression
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          replacement = "const safe=prefix.replace(/([%_\\\\])/g,'\\\\$1');"
          s2, count = re.subn(r"const safe=prefix\.replace\([^\n]+", replacement, s, count=1)
          if count != 1:
              raise SystemExit(f'Expected one broken expression, found {count}')
          p.write_text(s2, encoding='utf-8')
          PY
      - name: Validate every inline script
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s = Path('index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', s, re.S)
          if not scripts:
              raise SystemExit('No scripts found')
          for i, script in enumerate(scripts):
              Path(f'/tmp/poker-script-{i}.js').write_text(script, encoding='utf-8')
          PY
          for file in /tmp/poker-script-*.js; do node --check "$file"; done
      - name: Commit working game
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Repair game runtime and restore start buttons"
          git push
