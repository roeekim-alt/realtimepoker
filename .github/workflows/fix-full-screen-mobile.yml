name: Fix full-screen mobile rendering

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-full-screen-mobile.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index.html
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='/* FULL SCREEN MOBILE OVERRIDE V3 */'
          css=r'''

          /* FULL SCREEN MOBILE OVERRIDE V3 */
          html,body{height:100dvh!important;min-height:100dvh!important;background:#0a0806!important;color-scheme:dark!important}
          body,#game,#tableWrap,#table,.felt,#heroArea,#actions,.topbar{opacity:1!important;filter:none!important;-webkit-filter:none!important;mix-blend-mode:normal!important;forced-color-adjust:none!important}
          body{overflow:hidden!important;-webkit-text-size-adjust:100%!important;text-size-adjust:100%!important}
          #game{height:100dvh!important;min-height:100dvh!important;background:radial-gradient(130% 60% at 50% -8%,#221019 0%,transparent 55%),radial-gradient(140% 80% at 50% 118%,#0e1f18 0%,transparent 60%),#0a0806!important}
          #game::before,#game::after{pointer-events:none!important}
          .modal-backdrop,.sheet-backdrop,.scrim,.overlay,.dim,.backdrop{display:none!important;opacity:0!important;pointer-events:none!important}
          .felt{background:radial-gradient(80% 65% at 50% 34%,rgba(255,244,210,.12),transparent 60%),radial-gradient(120% 120% at 50% 50%,#173628 0%,#0c1d16 78%)!important;border-color:#5a2731!important;box-shadow:inset 0 0 40px rgba(0,0,0,.55),0 0 0 1.5px #a9863d,0 0 0 3px rgba(0,0,0,.6),0 18px 38px rgba(0,0,0,.58)!important}
          .seat .plate,.tb-pill,.iconbtn{background:rgba(18,14,12,.9)!important;border-color:rgba(226,188,99,.34)!important}
          .seat .nm,.tb-pill .lbl{color:#c9bca4!important}
          .seat .stk,.tb-pill b,#heroStack{color:#e7c467!important}
          #heroInfo .hand-rank{color:#73d9a6!important}
          #btnFold{background:#211a16!important;color:#e5d7c8!important;border:1px solid #6d5a48!important}
          #btnCheck{background:linear-gradient(180deg,#f7e5ad 0%,#d1ad54 58%,#987532 100%)!important;color:#1b150f!important;border:1px solid #ffe7a1!important;box-shadow:0 3px 10px rgba(201,162,75,.4)!important}
          #btnRaise{background:linear-gradient(180deg,#ef6670 0%,#b12b35 58%,#77171d 100%)!important;color:#fff!important;border:1px solid #ff7c85!important;box-shadow:0 3px 12px rgba(177,43,53,.45)!important}
          #btnAllin{background:#3b0f14!important;color:#ff8b94!important;border:1px solid #d53a46!important}
          #btnCheck,#btnRaise{min-height:58px!important;font-size:15px!important;font-weight:900!important;letter-spacing:.06em!important;flex:1.12 1 0!important}
          #btnFold,#btnAllin{min-height:54px!important;flex:.92 1 0!important}
          #actRow{gap:7px!important}
          #actRow.live .abtn:not([disabled]){opacity:1!important;filter:none!important}
          .abtn[disabled]{opacity:.42!important;filter:saturate(.55) brightness(.8)!important}

          @media (max-width:520px){
            .topbar{padding:calc(5px + env(safe-area-inset-top,0px)) 8px 4px!important;flex:0 0 auto!important}
            #tableWrap{flex:1 1 auto!important;min-height:0!important;padding:0 4px!important;overflow:hidden!important}
            #table{width:min(95vw,calc((100dvh - 236px)*.72))!important;height:auto!important;max-height:calc(100dvh - 236px)!important;aspect-ratio:.72!important;margin:auto!important}
            .felt{top:5.5%!important;bottom:4%!important;left:3%!important;right:3%!important;border-width:7px!important}
            #railLight{top:5.5%!important;bottom:4%!important;left:3%!important;right:3%!important}
            .seat{width:74px!important}
            .seat .av{width:44px!important;height:44px!important}
            .seat .nm{font-size:9px!important}
            .seat .stk{font-size:12px!important}
            #heroArea{padding:2px 10px 3px!important;flex:0 0 auto!important}
            #heroCards .card{width:54px!important;height:76px!important}
            #actions{padding:4px 8px calc(7px + env(safe-area-inset-bottom,0px))!important;flex:0 0 auto!important;background:#0a0806!important}
          }

          @media (max-width:520px) and (max-height:760px){
            #table{width:min(95vw,calc((100dvh - 218px)*.70))!important;max-height:calc(100dvh - 218px)!important;aspect-ratio:.70!important}
            #heroCards .card{width:50px!important;height:70px!important}
            #btnCheck,#btnRaise{min-height:56px!important;font-size:14px!important}
            #btnFold,#btnAllin{min-height:52px!important}
          }
          '''
          js=r'''
          <script>
          (function(){
            function clearPokerOverlays(){
              document.body.classList.remove('dimmed','modal-open','sheet-open','overlay-open');
              document.querySelectorAll('.modal-backdrop,.sheet-backdrop,.scrim,.overlay,.dim,.backdrop').forEach(function(el){
                el.classList.remove('open','on','show','active');
                el.style.display='none';
                el.style.opacity='0';
                el.style.pointerEvents='none';
              });
              var game=document.getElementById('game');
              if(game){ game.style.opacity='1'; game.style.filter='none'; }
            }
            window.addEventListener('pageshow',clearPokerOverlays);
            window.addEventListener('resize',clearPokerOverlays);
            window.addEventListener('orientationchange',clearPokerOverlays);
            document.addEventListener('visibilitychange',function(){if(!document.hidden)clearPokerOverlays();});
            setTimeout(clearPokerOverlays,100);
          })();
          </script>
          '''
          if marker not in s:
            s=s.replace('\n</style>',css+'\n</style>',1)
          if 'clearPokerOverlays' not in s:
            s=s.replace('\n</body>',js+'\n</body>',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Fix full-screen mobile colors and layout"
          git push
