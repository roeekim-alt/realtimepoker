name: Fix multiplayer action buttons

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-multiplayer-actions.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index.html
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          old = """  const cc=$('#btnCheck');
  cc.innerHTML=LA.canCheck?'Check':`Call<span class=\"sub\">${fmt(LA.callAmount)}</span>`;"""
          new = """  const cc=$('#btnCheck');
  cc.disabled=!(LA.canCheck||LA.canCall);
  cc.innerHTML=LA.canCheck?'Check':`Call<span class=\"sub\">${fmt(LA.callAmount)}</span>`;"""
          if old in s:
              s = s.replace(old, new, 1)

          old2 = """function openRaise(){
  const min=LA.canBet?LA.minBet:LA.minRaiseTo, max=LA.maxTo;"""
          new2 = """function openRaise(){
  if(!LA||(MP.active&&(!MP.state||!MP.state.game||MP.state.game.actor!==MP.seat)))return;
  const min=LA.canBet?LA.minBet:LA.minRaiseTo, max=LA.maxTo;"""
          if old2 in s:
              s = s.replace(old2, new2, 1)

          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Fix multiplayer check and raise buttons"
          git push
